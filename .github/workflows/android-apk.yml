name: Build JARVIS Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "JARVIS_Full_Upgrade_v2/JarvisAndroid/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: JARVIS_Full_Upgrade_v2/JarvisAndroid
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-debug-apk
          path: JARVIS_Full_Upgrade_v2/JarvisAndroid/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
